<!doctype html>
<html lang="en"><head>
<base href="/hab-testing/ground-station/">
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yagi Stand Drawings</title>
<style>
:root { --bg: #ffffff; }
html, body { margin: 0; background: var(--bg); }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
canvas { display: block; }
.nav { position: fixed; top: 8px; right: 8px; font: 14px sans-serif; background: #fff; border: 1px solid #ccc; padding: 6px 10px; border-radius: 6px; }
.nav a { margin: 0 4px; }
</style></head><body>
<canvas id="c" width="3508" height="2480" style="width:100%;max-width:3508px"></canvas>
<div class="nav" id="nav"></div>
<script src="heltec_mount_data.js"></script>
<script>
"use strict";
// ======================================================================= design (mm)
// One source for every number on the sheets. PROPOSAL = my design, not built.
// CONFIRM = depends on the antenna as delivered; check before cutting.
const DZ = {
  H: 1830,              // axle centre above ground (6 ft), chosen 2026-10-23
  collarY: 1000, collarL: 150,
  footY: 150,           // top of the socket plate
  legR: 600,            // foot centres on a 600 mm radius, 120 deg apart
  sleeveOD: 33.7, sleeveID: 28.5,   // 25 NB (1") light GI pipe, IS 1239: OD 33.7, wall 2.6
  pipeOD: 26.9,         // 20 NB (3/4") GI pipe, IS 1239: OD 26.9
  socketL: 80, plate: 100, plateT: 5,
  teeL: 120, axleL: 400, axleBack: 30, antOff: 250,
  handleY: 1200, handleL: 300, pointerY: 1090,
  disk: 220, diskBore: 35,
  // antenna as delivered: estimates from photos, CONFIRM
  boom: 760, boomSec: 16, front: 670, rear: 90, elHalf: 90, antPlate: [75, 75], uRod: 6.5,   // plate, boom section, U-bolt rod: measured 2026-10-23
  els: [205, 290, 335, 404, 473, 542, 611, 680, 749],     // from the rear end of the boom
  elLen: [180, 160, 130, 130, 130, 130, 130, 130, 130],
};
DZ.sleeveR = DZ.sleeveOD / 2; DZ.pipeR = DZ.pipeOD / 2;
DZ.mastL = Math.round(DZ.H - DZ.sleeveR - DZ.footY);       // foot of mast to underside of tee
const legDx = DZ.legR - DZ.sleeveR, legDy = DZ.collarY - DZ.plateT;
DZ.legL = Math.round(Math.hypot(legDx, legDy) / 5) * 5;
DZ.legAng = Math.round(Math.atan2(legDx, legDy) * 180 / Math.PI);
const rAtFoot = DZ.legR - (DZ.footY - DZ.plateT) / legDy * legDx;
DZ.barL = Math.round((rAtFoot - 12.5 - DZ.plate / 2) / 5) * 5;
DZ.swing = Math.round(Math.hypot(DZ.front, DZ.antOff));
DZ.topTilt90 = DZ.H + DZ.front + DZ.elHalf * 0;               // boom tip straight up
DZ.clear = DZ.sleeveID - DZ.pipeOD;

// ======================================================================= canvas helpers
const cv = document.getElementById("c"), c = cv.getContext("2d");
const W = 3508, Hpx = 2480, INK = "#111", DIM = "#1d4ed8", RED = "#b91c1c", MUT = "#555", FILL = "#e9edf2", STEEL = "#c9ced6";
const PX_PER_MM_PAPER = 3508 / 297;           // A4 landscape at 300 dpi
function font(px, w) { c.font = `${w || 400} ${px}px -apple-system, Segoe UI, Roboto, sans-serif`; }
function text(t, x, y, o = {}) {
  font(o.size || 30, o.weight); c.fillStyle = o.color || INK; c.textAlign = o.align || "left"; c.textBaseline = o.base || "middle";
  if (o.bg) { const w = c.measureText(t).width, s = o.size || 30, ax = o.align === "center" ? w / 2 : o.align === "right" ? w : 0; c.fillStyle = "#fff"; c.fillRect(x - ax - 6, y - s * 0.65, w + 12, s * 1.3); c.fillStyle = o.color || INK; }
  c.fillText(t, x, y);
}
function wrap(t, x, y, maxW, o = {}) {
  font(o.size || 28, o.weight); const words = t.split(" "); let line = "", yy = y, lh = (o.size || 28) * 1.35;
  for (const w of words) { const test = line ? line + " " + w : w; if (c.measureText(test).width > maxW && line) { text(line, x, yy, o); line = w; yy += lh; } else line = test; }
  if (line) text(line, x, yy, o); return yy + lh;
}
function view(ox, oy, scale) {        // model mm to px; y up
  const k = PX_PER_MM_PAPER / scale;
  return { X: x => ox + x * k, Y: y => oy - y * k, k, scale };
}
function line(x1, y1, x2, y2, o = {}) { c.strokeStyle = o.color || INK; c.lineWidth = o.w || 3; c.setLineDash(o.dash || []); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]); }
function rect(x1, y1, x2, y2, o = {}) { const x = Math.min(x1, x2), y = Math.min(y1, y2), w = Math.abs(x2 - x1), h = Math.abs(y2 - y1); if (o.fill) { c.fillStyle = o.fill; c.fillRect(x, y, w, h); } c.strokeStyle = o.color || INK; c.lineWidth = o.w || 3; c.setLineDash(o.dash || []); c.strokeRect(x, y, w, h); c.setLineDash([]); }
function circle(x, y, r, o = {}) { c.beginPath(); c.arc(x, y, r, 0, 2 * Math.PI); if (o.fill) { c.fillStyle = o.fill; c.fill(); } c.strokeStyle = o.color || INK; c.lineWidth = o.w || 3; c.setLineDash(o.dash || []); c.stroke(); c.setLineDash([]); }
function arrowHead(x, y, ang, col) { c.fillStyle = col; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 22 * Math.cos(ang - 0.3), y - 22 * Math.sin(ang - 0.3)); c.lineTo(x - 22 * Math.cos(ang + 0.3), y - 22 * Math.sin(ang + 0.3)); c.closePath(); c.fill(); }
// dimension between two px points, offset perpendicular by off px, label centred
function dim(x1, y1, x2, y2, label, off, o = {}) {
  const col = o.color || DIM, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const a = [x1 + nx * off, y1 + ny * off], b = [x2 + nx * off, y2 + ny * off];
  line(x1, y1, a[0] + nx * 10 * Math.sign(off), a[1] + ny * 10 * Math.sign(off), { color: col, w: 2 });
  line(x2, y2, b[0] + nx * 10 * Math.sign(off), b[1] + ny * 10 * Math.sign(off), { color: col, w: 2 });
  line(a[0], a[1], b[0], b[1], { color: col, w: 2.5 });
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  arrowHead(b[0], b[1], ang, col); arrowHead(a[0], a[1], ang + Math.PI, col);
  c.save(); c.translate((a[0] + b[0]) / 2 + nx * 26 * Math.sign(off), (a[1] + b[1]) / 2 + ny * 26 * Math.sign(off));
  let t = ang; if (t > Math.PI / 2 || t < -Math.PI / 2) t += Math.PI; c.rotate(t);
  text(label, 0, 0, { size: o.size || 30, color: col, align: "center", bg: true, weight: 600 }); c.restore();
}
function leader(x1, y1, x2, y2, label, o = {}) {
  line(x1, y1, x2, y2, { color: o.color || MUT, w: 2 }); circle(x1, y1, 5, { fill: o.color || MUT, color: o.color || MUT });
  const right = x2 >= x1;
  line(x2, y2, x2 + (right ? 30 : -30), y2, { color: o.color || MUT, w: 2 });
  const lines = Array.isArray(label) ? label : [label];
  lines.forEach((l, i) => text(l, x2 + (right ? 40 : -40), y2 + i * 36, { size: o.size || 30, align: right ? "left" : "right", color: o.tc || INK, weight: i === 0 ? 600 : 400 }));
}
function frame(n, total, title, scaleNote) {
  c.fillStyle = "#fff"; c.fillRect(0, 0, W, Hpx);
  rect(40, 40, W - 40, Hpx - 40, { w: 5 });
  // title block
  const tbY = Hpx - 230;
  rect(40, tbY, W - 40, Hpx - 40, { w: 5 });
  line(1700, tbY, 1700, Hpx - 40, { w: 3 }); line(2600, tbY, 2600, Hpx - 40, { w: 3 }); line(3100, tbY, 3100, Hpx - 40, { w: 3 });
  text("HAB-1 GROUND STATION: YAGI STAND", 70, tbY + 55, { size: 40, weight: 700 });
  text(title, 70, tbY + 115, { size: 46, weight: 700, color: "#0b3a8a" });
  text("Antenna: TX900-BM-9, 868/915 MHz 12 dBi, 9 elements. Boscon Space.", 70, tbY + 170, { size: 28, color: MUT });
  c.fillStyle = "#fff4d6"; c.fillRect(1702, tbY + 2, 896, 64);
  text("ALL SIZES IN MILLIMETRES (mm)", 1730, tbY + 26, { size: 34, weight: 800, color: "#7c2d12" });
  text("1000 mm = 1 m = 39.4 inch", 1730, tbY + 56, { size: 24, weight: 600, color: "#7c2d12" });
  text(scaleNote || "Not to scale where marked NTS.", 1730, tbY + 92, { size: 25 });
  text("PROPOSAL: not yet built or tested.", 1730, tbY + 128, { size: 25, color: RED, weight: 600 });
  text("CONFIRM = estimate from photos; check first.", 1730, tbY + 164, { size: 25, color: RED });
  text("Date", 2630, tbY + 55, { size: 26, color: MUT }); text("2026-10-26", 2630, tbY + 100, { size: 34, weight: 600 });
  text("Rev C", 2630, tbY + 165, { size: 34, weight: 600 });
  text("Sheet", 3130, tbY + 55, { size: 26, color: MUT }); text(`${n} / ${total}`, 3130, tbY + 120, { size: 64, weight: 700 });

}
// every dimension carries its unit: millimetres. Big ones also in metres and inches.
const mm = v => `${Math.round(v * 10) / 10} mm`;
const big = v => `${Math.round(v)} mm = ${(v / 1000).toFixed(2)} m = ${(v / 25.4).toFixed(1)} in`;

function northArrow(x, y, s = 1) {
  line(x, y + 70 * s, x, y - 50 * s, { w: 4 }); arrowHead(x, y - 70 * s, -Math.PI / 2, INK); text("N", x, y + 105 * s, { size: 40, weight: 700, align: "center" });
}

// ======================================================================= sheets
const SHEETS = [];

// ---- 1: overview render
SHEETS.push(["Overview", (img) => {
  frame(1, SHEETS.length, "OVERVIEW AND KEY DIMENSIONS", "3D render: not to scale (NTS).");
  if (img) { const w = 2300, h = w * img.height / img.width; c.drawImage(img, 60, 60, w, Math.min(h, 2120)); }
  let y = 120; const x = 2420;
  text("What this is", x, y, { size: 44, weight: 700 }); y += 70;
  y = wrap("A rotating mast on a welded tripod that holds the TX900-BM-9 Yagi at 1830 mm (6 ft). The whole mast turns in a sleeve for azimuth (pan). A horizontal axle through a tee at the top turns for tilt (0 to 90 deg). The antenna clamps to the axle with its own plate and U-bolts.", x, y, 1000, { size: 30 }); y += 30;
  text("Key dimensions", x, y, { size: 40, weight: 700 }); y += 60;
  for (const [k, v] of [["Axle centre height", `${DZ.H} mm = 1.83 m = 6 ft`], ["Collar sleeve centre", `${DZ.collarY} mm`], ["Foot socket (mast foot)", `${DZ.footY} mm`],
    ["Tripod feet", `on a ${DZ.legR} mm radius (1200 mm across), 120 deg apart`], ["Mast", `3/4 inch (20 NB) GI pipe, ${DZ.mastL} mm long`], ["Sleeves", "1 inch (25 NB) light GI pipe, OD 33.7 mm"],
    ["Axle", `3/4 inch (20 NB) GI pipe, ${DZ.axleL} mm`], ["Antenna on axle", `${DZ.antOff} mm from mast centre`], ["Boom swing radius", `${DZ.swing} mm: keep ${800} mm clear`],
    ["Highest point (tilt 90)", `about ${DZ.H + DZ.front} mm`]]) {
    text(k, x, y, { size: 28, color: MUT }); text(v, x + 470, y, { size: 28, weight: 600 }); y += 46;
  }
  y += 30; text("Rules", x, y, { size: 40, weight: 700 }); y += 60;
  for (const r of ["Antenna ELEMENTS VERTICAL, always.", "Mast must turn freely 360 deg in the sleeve.", "Tilt 0 deg = boom level (check with a phone clinometer).", "Azimuth 0 deg = TRUE north.", "Nothing metal within 0.5 m in front of the antenna.", "Paint after welding; keep bores clean and greased."])
    y = wrap("- " + r, x, y, 1000, { size: 30 });
}]);

// ---- 2: general arrangement, two elevations at 1:15
SHEETS.push(["Elevations", () => {
  frame(2, SHEETS.length, "GENERAL ARRANGEMENT: SIDE AND FRONT ELEVATION", "Scale 1:15 on A4 (print at 100%).");
  const S = 15;
  // ---------- side elevation: looking along the axle; boom to the right
  const A = view(720, 2090, S);
  text("SIDE ELEVATION (looking along the axle)", A.X(-600), 110, { size: 36, weight: 700 });
  line(A.X(-900), A.Y(0), A.X(1300), A.Y(0), { w: 3 });
  for (let x = -900; x < 1300; x += 60) line(A.X(x), A.Y(0), A.X(x - 40), A.Y(0) + 18, { w: 1.5, color: MUT });
  // legs: feet at z = +600 and -300 (two overlap)
  const leg = (fz) => { line(A.X(fz), A.Y(DZ.plateT), A.X(Math.sign(fz) * DZ.sleeveR), A.Y(DZ.collarY), { w: 9, color: "#333" }); rect(A.X(fz - 50), A.Y(0), A.X(fz + 50), A.Y(DZ.plateT), { fill: "#333", w: 1 }); };
  leg(-600); leg(300);
  // spreader + socket
  line(A.X(-510), A.Y(DZ.footY), A.X(255), A.Y(DZ.footY), { w: 5, color: "#555" });
  rect(A.X(-50), A.Y(DZ.footY - DZ.plateT), A.X(50), A.Y(DZ.footY), { fill: "#555", w: 1 });
  rect(A.X(-DZ.sleeveR), A.Y(DZ.footY), A.X(DZ.sleeveR), A.Y(DZ.footY + DZ.socketL), { fill: FILL });
  // collar sleeve and disk
  rect(A.X(-DZ.sleeveR), A.Y(DZ.collarY - DZ.collarL / 2), A.X(DZ.sleeveR), A.Y(DZ.collarY + DZ.collarL / 2), { fill: FILL });
  rect(A.X(-DZ.disk / 2), A.Y(DZ.collarY + DZ.collarL / 2), A.X(DZ.disk / 2), A.Y(DZ.collarY + DZ.collarL / 2 + 3), { fill: "#888", w: 2 });
  // mast
  rect(A.X(-DZ.pipeR), A.Y(DZ.footY), A.X(DZ.pipeR), A.Y(DZ.H - DZ.sleeveR), { fill: STEEL });
  // handle (end-on) and pointer
  line(A.X(-150), A.Y(DZ.handleY), A.X(150), A.Y(DZ.handleY), { w: 7 });
  // tee (end-on: circle) and axle (end-on)
  circle(A.X(0), A.Y(DZ.H), DZ.sleeveR * A.k, { fill: FILL }); circle(A.X(0), A.Y(DZ.H), DZ.pipeR * A.k, { fill: STEEL });
  // antenna at tilt 0 (solid) and tilt 90 (dashed); boom forward to the right
  const yB = DZ.H + DZ.pipeR + 3 + DZ.boomSec / 2;
  rect(A.X(-DZ.rear), A.Y(yB - DZ.boomSec / 2), A.X(DZ.front), A.Y(yB + DZ.boomSec / 2), { fill: STEEL });
  DZ.els.forEach((d, i) => { const z = d - DZ.rear; line(A.X(z), A.Y(yB - DZ.elLen[i] / 2), A.X(z), A.Y(yB + DZ.elLen[i] / 2), { w: i === 1 ? 6 : 4, color: i === 1 ? "#1d4ed8" : INK }); });
  rect(A.X(-50), A.Y(DZ.H + DZ.pipeR), A.X(50), A.Y(DZ.H + DZ.pipeR + 3), { fill: "#888", w: 1 });
  line(A.X(0), A.Y(DZ.H - DZ.rear), A.X(0), A.Y(DZ.H + DZ.front), { w: 3, dash: [16, 10], color: MUT });
  text("tilt 90 deg", A.X(30), A.Y(DZ.H + DZ.front - 40), { size: 26, color: MUT });
  c.strokeStyle = MUT; c.lineWidth = 2; c.setLineDash([10, 8]); c.beginPath(); c.arc(A.X(0), A.Y(DZ.H), 300 * A.k, -Math.PI / 2, 0); c.stroke(); c.setLineDash([]);
  text("0 to 90 deg", A.X(230), A.Y(DZ.H + 230), { size: 26, color: MUT });
  // dims
  dim(A.X(-720), A.Y(0), A.X(-720), A.Y(DZ.H), `axle centre ${big(DZ.H)} (6 ft)`, -30);
  dim(A.X(-620), A.Y(0), A.X(-620), A.Y(DZ.collarY), `${mm(DZ.collarY)} to collar centre`, 40);
  dim(A.X(-380), A.Y(0), A.X(-380), A.Y(DZ.footY), mm(DZ.footY), 40);
  dim(A.X(-230), A.Y(DZ.footY), A.X(-230), A.Y(DZ.H - DZ.sleeveR), `mast ${mm(DZ.mastL)}`, -20);
  dim(A.X(-DZ.rear), A.Y(DZ.H + 330), A.X(DZ.front), A.Y(DZ.H + 330), `${DZ.rear} mm + ${DZ.front} mm = boom ${mm(DZ.boom)} (CONFIRM)`, -10);
  dim(A.X(-600), A.Y(-40), A.X(300), A.Y(-40), "900 mm between feet, seen from this side", 25, { size: 26 });
  leader(A.X(DZ.sleeveR), A.Y(DZ.collarY), A.X(320), A.Y(DZ.collarY + 120), ["collar sleeve", `1 inch (25 NB) pipe x ${mm(DZ.collarL)}`]);
  leader(A.X(DZ.sleeveR), A.Y(DZ.footY + 40), A.X(400), A.Y(DZ.footY + 260), ["foot socket", `1 inch pipe x ${mm(DZ.socketL)} on ${DZ.plate} x ${DZ.plate} x ${DZ.plateT} mm plate`]);
  leader(A.X(140), A.Y(DZ.handleY), A.X(420), A.Y(DZ.handleY + 120), ["handle", `16 mm rod x ${mm(DZ.handleL)}, ${mm(DZ.handleY)} above ground`]);
  leader(A.X(DZ.sleeveR), A.Y(DZ.H), A.X(380), A.Y(DZ.H - 230), ["tee: 1 inch pipe x 120 mm", "axle 3/4 inch pipe inside"]);
  leader(A.X(DZ.els[1] - DZ.rear), A.Y(yB - 80), A.X(820), A.Y(DZ.H - 90), ["driven element", "(folded dipole)"], { tc: "#1d4ed8" });
  // ---------- front elevation: looking at the antenna's front; axle left-right
  const B = view(2550, 2090, S);
  text("FRONT ELEVATION (looking at the antenna)", B.X(-700), 110, { size: 36, weight: 700 });
  line(B.X(-800), B.Y(0), B.X(950), B.Y(0), { w: 3 });
  for (let x = -800; x < 950; x += 60) line(B.X(x), B.Y(0), B.X(x - 40), B.Y(0) + 18, { w: 1.5, color: MUT });
  for (const fx of [-520, 520, 0]) { line(B.X(fx), B.Y(DZ.plateT), B.X(Math.sign(fx) * DZ.sleeveR), B.Y(DZ.collarY), { w: fx ? 9 : 7, color: fx ? "#333" : "#777" }); rect(B.X(fx - 50), B.Y(0), B.X(fx + 50), B.Y(DZ.plateT), { fill: "#333", w: 1 }); }
  line(B.X(-445), B.Y(DZ.footY), B.X(445), B.Y(DZ.footY), { w: 5, color: "#555" });
  rect(B.X(-DZ.sleeveR), B.Y(DZ.footY), B.X(DZ.sleeveR), B.Y(DZ.footY + DZ.socketL), { fill: FILL });
  rect(B.X(-DZ.sleeveR), B.Y(DZ.collarY - DZ.collarL / 2), B.X(DZ.sleeveR), B.Y(DZ.collarY + DZ.collarL / 2), { fill: FILL });
  rect(B.X(-DZ.disk / 2), B.Y(DZ.collarY + DZ.collarL / 2), B.X(DZ.disk / 2), B.Y(DZ.collarY + DZ.collarL / 2 + 3), { fill: "#888", w: 2 });
  rect(B.X(-DZ.pipeR), B.Y(DZ.footY), B.X(DZ.pipeR), B.Y(DZ.H - DZ.sleeveR), { fill: STEEL });
  rect(B.X(-DZ.handleL / 2), B.Y(DZ.handleY - 8), B.X(DZ.handleL / 2), B.Y(DZ.handleY + 8), { fill: "#333", w: 1 });
  rect(B.X(-DZ.teeL / 2), B.Y(DZ.H - DZ.sleeveR), B.X(DZ.teeL / 2), B.Y(DZ.H + DZ.sleeveR), { fill: FILL });
  rect(B.X(-DZ.axleBack), B.Y(DZ.H - DZ.pipeR), B.X(DZ.axleL - DZ.axleBack), B.Y(DZ.H + DZ.pipeR), { fill: STEEL });
  // antenna seen from the front: plate, boom section, elements vertical
  rect(B.X(DZ.antOff - DZ.antPlate[1] / 2), B.Y(DZ.H + DZ.pipeR), B.X(DZ.antOff + DZ.antPlate[1] / 2), B.Y(DZ.H + DZ.pipeR + 3), { fill: "#888", w: 1 });
  rect(B.X(DZ.antOff - 7.5), B.Y(yB - 7.5), B.X(DZ.antOff + 7.5), B.Y(yB + 7.5), { fill: STEEL });
  line(B.X(DZ.antOff), B.Y(yB - 90), B.X(DZ.antOff), B.Y(yB + 90), { w: 6 });
  c.strokeStyle = "#1d4ed8"; c.lineWidth = 4; c.beginPath(); c.ellipse(B.X(DZ.antOff), B.Y(yB), 15 * B.k, 80 * B.k, 0, 0, 2 * Math.PI); c.stroke();
  // U-bolts
  for (const s of [-1, 1]) { c.strokeStyle = "#666"; c.lineWidth = 3; c.beginPath(); c.arc(B.X(DZ.antOff + s * 25), B.Y(DZ.H), (DZ.pipeR + 4) * B.k, 0, Math.PI); c.stroke(); }
  dim(B.X(-DZ.axleBack), B.Y(DZ.H - 120), B.X(DZ.axleL - DZ.axleBack), B.Y(DZ.H - 120), `axle ${mm(DZ.axleL)}`, 50);
  dim(B.X(0), B.Y(DZ.H + 260), B.X(DZ.antOff), B.Y(DZ.H + 260), mm(DZ.antOff), -10);
  dim(B.X(-DZ.teeL / 2), B.Y(DZ.H + 130), B.X(DZ.teeL / 2), B.Y(DZ.H + 130), `tee ${mm(DZ.teeL)}`, -10, { size: 26 });
  dim(B.X(-520), B.Y(-40), B.X(520), B.Y(-40), "1040 mm between feet, seen from this side", 25, { size: 26 });
  dim(B.X(-DZ.handleL / 2), B.Y(DZ.handleY + 90), B.X(DZ.handleL / 2), B.Y(DZ.handleY + 90), mm(DZ.handleL), -10, { size: 26 });

  y += 30; text("Checks before use", x, y, { size: 36, weight: 700 }); y += 60;
  for (const l of ["Mast plumb both ways (spirit level).", "Mast turns 360 deg freely, locks firm.", `Axle centre ${DZ.H} mm (+/- 10 mm) above ground.`, "Elements vertical.", "Tilt 0 to 90 holds with the lock.", "Disk 0 deg on TRUE north.", "Stand steady with antenna fitted: push test at the top."]) { y = wrap("[ ] " + l, x, y, 470, { size: 26 }) + 4; }
}]);


// ---- 7: Heltec mount (3D print)
SHEETS.push(["Heltec mount", (img) => {
  frame(7, SHEETS.length, "HELTEC RECEIVER MOUNT (3D PRINT, PETG)", "3D render: not to scale (NTS). CAD: cad/heltec_mount/.");
  if (img) { const w = 2080, h = w * img.height / img.width; c.drawImage(img, 60, 60, w, Math.min(h, 1560)); }
  const m = (window.HELTEC_MOUNT || { meta: { d_range: [13, 46.6] } }).meta;
  let y = 120; const x = 2200;
  text("What it is", x, y, { size: 42, weight: 700 }); y += 60;
  y = wrap(`A case for the Heltec V3 on a bolted V-clamp. The clamp is not one size: its 130 deg V-grooves grip any round pipe from ${m.d_range[0]} to ${m.d_range[1]} mm and square tube from 10 to 40 mm (computed, cad/heltec_mount/check_heltec_mount.py). The case slides onto the clamp's dovetail along or across the pipe. All PETG, no metal: printed M10 bolts and thumb-nuts, a snap-fit lid, a press-fit lock pin.`, x, y, 1240, { size: 28 }); y += 24;
  text("On this stand", x, y, { size: 36, weight: 700 }); y += 54;
  for (const l of ["Under the 20 NB axle (26.9), centred 125 mm from the mast centre.", "Tilts with the antenna, so the coax never bends; only the USB moves.", "SMA end toward the antenna; USB end toward the mast; OLED faces down."]) y = wrap("- " + l, x, y, 1240, { size: 28 }) + 4;
  y += 20; text("Print (PETG)", x, y, { size: 36, weight: 700 }); y += 54;
  for (const l of ["jaw_top, jaw_bot: on their end face (profile flat), no supports. Holes print as teardrops.", "case: base down (dovetail channels bridge). lid: outer face down.", "Bolts head down, nuts flat, pins head down. Jaws 6 walls + 40 % gyroid; case and lid 3 walls + 15 % gyroid; bolts, nuts, pin 100 %.", "96 g of PETG (31.4 m of 1.75 mm) for one mount, sliced in Creality Print; about 4 h 20 min if printed part by part.", "Plates in cad/print/heltec-mount/: plate_1 jaws + case + lid + pins, plate_2 two 55 mm bolts + nuts, plate_3 two 75 mm bolts (only for pipes over 29 mm)."]) y = wrap("- " + l, x, y, 1240, { size: 28 }) + 4;
  y += 20; text("Printed hardware (no metal)", x, y, { size: 36, weight: 700 }); y += 54;
  for (const l of ["2 x M10 x 1.5 bolt, hex head captive in jaw_top: 55 mm (this stand) or 75 mm (pipes to 46.6). Thread clearance 0.3 mm radial (computed).", "2 x knurled thumb-nut, 28 mm across, hand tight.", "Lid: 4 snap hooks (2.2 % strain to fit, computed). Lock pin: 3.15 in a 3.0 hole, tap in.", "Bought: u.FL to SMA-jack bulkhead pigtail (BOM row 5), 1 mm foam pad under the header pins."]) y = wrap("- " + l, x, y, 1240, { size: 28 }) + 4;
  // assembly under the render
  let ya = 1680;
  text("Assembly", 70, ya, { size: 36, weight: 700 }); ya += 54;
  for (const l of ["1. Printed bolt heads into the hex pockets of jaw_top (the jaw with the tongue). Pass the bolts either side of the axle and through jaw_bot; thumb-nuts on loosely.",
                   "2. Slide the case onto the tongue (channel along the case), line up the centre hole, tap the printed lock pin in from inside the case.",
                   "3. Fit the SMA bulkhead in the far end wall; plug the pigtail into the Heltec's u.FL; Heltec in on its header pins, USB-C at the port.",
                   "4. Press the lid on until all 4 hooks click. Hang the clamp under the axle, 125 mm from the mast; tighten both thumb-nuts evenly by hand."]) ya = wrap(l, 70, ya, 2050, { size: 27 }) + 6;
  text("CONFIRMED by Aditya: the Heltec has its header pins soldered; it stands on them (2.5 plastic + 6.0 pin, standard header, assumed lengths).", 70, ya + 20, { size: 27, color: "#1a7f37", weight: 600 });
}]);

// ======================================================================= render
const Q = new URLSearchParams(location.search), n = Math.max(1, Math.min(SHEETS.length, +(Q.get("sheet") || 1)));
document.getElementById("nav").innerHTML = SHEETS.map((s, i) => `<a href="/hab-testing/ground-station/build-sheets?sheet=${i + 1}">${i + 1} ${s[0]}</a>`).join("");
if (Q.get("export")) document.getElementById("nav").style.display = "none";
const imgFor = { 1: "build/render-overall.png", 5: "build/render-head.png", 7: "build/render-mount.png" };
if (imgFor[n]) { const im = new Image(); im.onload = () => SHEETS[n - 1][1](im); im.onerror = () => SHEETS[n - 1][1](null); im.src = imgFor[n]; }
else SHEETS[n - 1][1]();
</script></body></html>
